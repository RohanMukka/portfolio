<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8" />

    <title>Rohan Mukka · Software Engineer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Portfolio of Rohan Mukka, a Software Engineer specializing in scalable web systems and intelligent automation." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      // Saved theme before first paint (see src/lib/theme.ts); dark by default.
      try {
        document.documentElement.setAttribute("data-theme", localStorage.getItem("color-theme") === "light" ? "light" : "dark");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
