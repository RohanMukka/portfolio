<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rohan Mukka · Software Engineer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Rohan Mukka, software engineer: full-stack products and ML systems that hold up in production." />
    <meta name="theme-color" content="#0a0a0d" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfolio-rohan03.vercel.app/" />
    <meta property="og:title" content="Rohan Mukka · Software Engineer" />
    <meta property="og:description" content="Full-stack products and ML systems that hold up in production." />
    <meta name="twitter:card" content="summary" />
    <!-- The intro's first frame (a line of the brand's colours on the page's
         background, and a loading counter), drawn straight from the HTML so
         something is on screen before the scripts arrive. The intro takes
         over at the same place and this fades out (HeroIntro.tsx). -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 200; background: #0a0a0d; transition: opacity 0.4s ease; }
      [data-theme="light"] #boot { background: #f4f1ea; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot-line { position: absolute; left: 14px; right: 14px; top: 46.5%; height: 8px; margin-top: -4px; border-radius: 9999px; background: linear-gradient(90deg, #3b6cff, #e0457b 55%, #ff7a3d); transform: scaleX(0.04); }
      #boot-count { position: absolute; right: 70px; bottom: 62px; margin: 0; font: 500 10px/1 ui-monospace, monospace; letter-spacing: 0.3em; text-transform: uppercase; color: #94a3b8; }
      [data-theme="light"] #boot-count { color: #003399d9; }
      @media (max-width: 1023px) { #boot-line { top: 44.5%; } }
      @media (max-width: 767px) { #boot-line { left: 10px; right: 10px; top: 41%; } #boot-count { right: 34px; bottom: 42px; } }
    </style>
    <script>
      // Saved theme before first paint (see src/lib/theme.ts); dark by default.
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("color-theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4f1ea");
        // A saved "pause motion" choice (see src/lib/motion.ts), also before first paint.
        try {
          if (localStorage.getItem("motion") === "paused") document.documentElement.setAttribute("data-motion", "paused");
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div id="boot-line"></div><p id="boot-count">Loading 000</p></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
