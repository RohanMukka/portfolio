    <script>
      // Saved theme before first paint (see src/lib/theme.ts); dark by default.
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("color-theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4f1ea");
      })();
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
